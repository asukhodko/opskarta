version: 3

meta:
  id: release-window
  title: "Release with executive view"
  effort_unit: "pt"

statuses:
  not_started: { label: "Not Started", color: "#9ca3af" }
  in_progress: { label: "In Progress", color: "#0ea5e9" }
  done: { label: "Done", color: "#22c55e" }
  blocked: { label: "Blocked", color: "#fecaca" }

nodes:
  release:
    title: "Service release"
    kind: summary
    status: in_progress

  prep:
    title: "Preparation"
    kind: phase
    parent: release
    status: done

  prep-runbook:
    title: "Check runbook and roles"
    kind: task
    parent: prep
    status: done
    effort: 2

  gate-ready:
    title: "Go/no-go before window"
    kind: milestone
    milestone: true
    parent: release
    deps: [prep-runbook]
    status: done

  cutover:
    title: "Cutover window"
    kind: phase
    parent: release
    deps: [gate-ready]
    status: in_progress

  cutover-switch:
    title: "Switch traffic"
    kind: task
    parent: cutover
    status: in_progress
    effort: 3
    x:
      ops:
        attention_class: date_holder

  cutover-check:
    title: "Check user scenarios"
    kind: task
    parent: cutover
    deps: [cutover-switch]
    status: not_started
    effort: 2

  gate-done:
    title: "Release completed"
    kind: milestone
    milestone: true
    parent: release
    deps: [cutover-check]
    status: not_started

  post:
    title: "Post-window stabilization"
    kind: phase
    parent: release
    deps:
      - id: gate-done
        type: fs
        hard: false
        note: "Useful tail, does not hold the cutover window"
    status: not_started

  post-cleanup:
    title: "Clean up temporary settings"
    kind: task
    parent: post
    status: not_started
    effort: 1
    x:
      ops:
        attention_class: tail

schedule:
  calendars:
    work:
      excludes: [weekends]
  default_calendar: work
  nodes:
    prep-runbook:
      start: "2026-06-01"
      duration: "1d"
    gate-ready:
      start: "2026-06-02"
      duration: "1d"
    cutover-switch:
      start: "2026-06-03"
      duration: "1d"
    cutover-check:
      duration: "1d"
    gate-done:
      duration: "1d"
    post-cleanup:
      start: "2026-06-08"
      duration: "2d"

views:
  release-window:
    title: "Release window"
    date_format: "YYYY-MM-DD"
    axis_format: "%d.%m"
    window_start: "2026-06-01"
    window_finish: "2026-06-10"
    lanes:
      main:
        title: "Main path"
        expand_descendants: leaves
        nodes: [prep, cutover]
      tails:
        title: "Parallel tails"
        nodes: [post-cleanup]

  date-holders:
    title: "Date holders"
    where:
      x_ops_attention_class: [date_holder]

x:
  exec:
    program:
      committed_date: "2026-06-04"
      nearest_goal: "Pass the cutover window without rollback."
      success_by_next_sync: "Checks are green and post-cleanup has an owner."
    defaults:
      status_progress:
        done: 1.0
        in_progress: 0.5
        not_started: 0.0
        blocked: 0.0
      weight_strategy: effort_effective
    blocks:
      prep:
        title: "Preparation"
        scope_nodes: [prep]
        target_gate: gate-ready
        kind: main
        mgmt:
          health: green
          sync_note: "Runbook and roles are checked."
          next_sync_goal: "Keep readiness until the window starts."
      cutover:
        title: "Cutover window"
        scope_nodes: [cutover]
        target_gate: gate-done
        kind: main
        mgmt:
          health: yellow
          sync_note: "The main risk is user checks after the switch."
          next_sync_goal: "Finish smoke checks and decide when to open users."
      post:
        title: "Stabilization"
        scope_nodes: [post]
        target_gate: gate-done
        kind: risk_sidecar
        progress_override: 0.0
        mgmt:
          health: neutral
          sync_note: "Useful tail, does not hold the window."
    edges:
      - from: prep
        to: cutover
        type: required
      - from: post
        to: cutover
        type: context
        label: "after window"
    views:
      exec-top:
        direction: LR
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: false
        show_gate_date: true
        wrap_title_lines: 2
        caption: "Short sync map: readiness, cutover and post-window stabilization."
        blocks: [prep, cutover, post]
      exec-active-tracks:
        direction: TB
        blocks: [cutover, post]
